<script>
  fetch('roster.json')
    .then(response => response.json())
    .then(data => {
      let tanks = 0, heals = 0, dps = 0;
      let gridHtml = '';

      data.forEach(pj => {
        const role = pj.role ? pj.role.toLowerCase() : '';
        if (role.includes('tank') || role.includes('tanque')) tanks++;
        else if (role.includes('heal') || role.includes('sanador')) heals++;
        else dps++; 

        const claseCss = pj.class ? pj.class.toLowerCase().replace(/\s+/g, '') : '';
        
        gridHtml += `<div><div class="${claseCss}"><strong>${pj.name}</strong></div><div><small>${pj.class} - ${pj.role || 'DPS'}</small></div></div>`;
      });

      document.getElementById('roster-grid').innerHTML = gridHtml;
      document.getElementById('roster-counts').innerHTML = `
        <span><strong>${tanks}</strong> tanques</span> | 
        <span><strong>${heals}</strong> sanadores</span> | 
        <span><strong>${dps}</strong> daño</span> | 
        <span><strong>${data.length}</strong> total</span>
      `;
    })
    .catch(error => console.error('Error cargando el roster:', error));
</script>
