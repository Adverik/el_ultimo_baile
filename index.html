<script>
fetch('roster.json')
  .then(response => response.json())
  .then(data => {
    const grid = document.getElementById('roster-grid')
    grid.innerHTML = data.map(pj => 
      `<div><div>${pj.name}</div><div>${pj.class}, ${pj.role}</div></div>`
    ).join('')
  })
  .catch(error => console.error('Error cargando el roster:', error))
</script>
