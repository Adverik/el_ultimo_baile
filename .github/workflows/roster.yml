name: Actualizar datos (wowaudit y Discord)

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, en el minuto 17
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

# Mínimo privilegio: solo puede escribir contenido del repo (para commitear los JSON)
permissions:
  contents: write

concurrency:
  group: roster
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WOWAUDIT_API_KEY: ${{ secrets.WOWAUDIT_API_KEY }}
      WOWAUDIT_BASE_URL: ${{ vars.WOWAUDIT_BASE_URL }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Roster
        run: python3 scripts/actualizar_roster.py

      - name: Raids y botín
        run: python3 scripts/actualizar_actividad.py

      - name: Recuento de Discord
        run: python3 scripts/actualizar_discord.py

      - name: Guardar cambios si los hay
        run: |
          if git diff --quiet -- roster.json actividad.json discord.json && [ -z "$(git ls-files --others --exclude-standard -- actividad.json discord.json)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roster.json actividad.json
          [ -f discord.json ] && git add discord.json
          git commit -m "Actualiza datos (wowaudit y Discord)"
          git push
